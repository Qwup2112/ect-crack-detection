name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.14 (the version the app runs on)
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
    - name: Install dependencies
      # The app's requirements, so pylint can check the calls into them - minus ultralytics and
      # onnx (training / export only; they pull in gigabytes of PyTorch). .pylintrc ignores those.
      run: |
        python -m pip install --upgrade pip
        grep -vE '^(ultralytics|onnx)>' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
        pip install -r "$RUNNER_TEMP/requirements-ci.txt" pylint
    - name: Analysing the code with pylint
      # Settings in .pylintrc: errors fail the build, everything else is only reported.
      run: |
        pylint app
